    const fmt = (n) => Math.round(n).toLocaleString("pt-BR");

    function tier(pct) {
      if (pct >= 0.2) return { color: "#1E9E6B", label: "Em ritmo" };
      if (pct >= 0.1) return { color: "#F0A93C", label: "Atenção" };
      return { color: "#D9534F", label: "Crítico" };
    }

    function KpiCard({ label, value, sub, accent }) {
      return (
        <div style={{ background: "white", borderRadius: 14, padding: "16px 18px", boxShadow: "0 1px 3px rgba(16,24,40,0.06)", borderTop: `3px solid ${accent}` }}>
          <div style={{ fontSize: 11, color: "#64748B", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 }}>{label}</div>
          <div style={{ fontSize: 22, fontWeight: 800, marginTop: 4, color: "#1B2430" }}>{value}</div>
          <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 2 }}>{sub}</div>
        </div>
      );
    }

    function LegendDot({ color, label }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 9, height: 9, borderRadius: 999, background: color, display: "inline-block" }} />
          {label}
        </div>
      );
    }

    function ProgressRow({ isMobile, code, name, sub, pot, meta, real, ref25 }) {
      const pct = meta > 0 ? real / meta : 0;
      const t = tier(pct);
      const widthPct = Math.min(pct * 100, 100);
      const delta = (ref25 !== undefined && ref25 > 0) ? ((real - ref25) / ref25) * 100 : null;

      if (isMobile) {
        return (
          <div style={{ padding: "10px 0", borderBottom: "1px solid #F1F5F9" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <div style={{ fontSize: 10, fontWeight: 800, color: "white", background: t.color, borderRadius: 6, textAlign: "center", padding: "3px 7px", whiteSpace: "nowrap" }}>{code}</div>
              <div style={{ fontSize: 13, color: "#334155", fontWeight: 500, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{name}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: t.color }}>{(pct * 100).toFixed(1)}%</div>
            </div>
            {sub && <div style={{ fontSize: 10, color: "#94A3B8", marginBottom: 4 }}>{sub}</div>}
            <div style={{ position: "relative", background: "#EEF2F7", borderRadius: 6, height: 12, overflow: "hidden", marginBottom: 4 }}>
              <div style={{ width: `${widthPct}%`, background: t.color, height: "100%", borderRadius: 6 }} />
            </div>
            <div style={{ fontSize: 10, color: "#94A3B8", display: "flex", justifyContent: "space-between" }}>
              <span>Potencial: <b style={{ color: "#64748B" }}>{fmt(pot)}</b></span>
              <span>Real.: <b style={{ color: "#475569" }}>{fmt(real)}</b> / Meta: {fmt(meta)}</span>
            </div>
            {ref25 !== undefined && (
              <div style={{ fontSize: 10, color: "#94A3B8", marginTop: 2, display: "flex", justifyContent: "space-between" }}>
                <span>Realizado 2025: <b style={{ color: "#64748B" }}>{fmt(ref25)}</b></span>
                {delta !== null && <span style={{ fontWeight: 700, color: delta >= 0 ? "#1E9E6B" : "#D9534F" }}>{delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(0)}%</span>}
              </div>
            )}
          </div>
        );
      }

      return (
        <div style={{ display: "grid", gridTemplateColumns: "36px 190px 90px 1fr 230px", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #F1F5F9" }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: "white", background: t.color, borderRadius: 6, textAlign: "center", padding: "3px 0" }}>{code}</div>
          <div style={{ fontSize: 13, color: "#334155", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={name}>
            {name}
            {sub && <div style={{ fontSize: 10, color: "#94A3B8", fontWeight: 400 }}>{sub}</div>}
          </div>
          <div style={{ fontSize: 11, color: "#64748B", textAlign: "right" }}>pot. {fmt(pot)}</div>
          <div style={{ position: "relative", background: "#EEF2F7", borderRadius: 6, height: 16, overflow: "hidden" }}>
            <div style={{ width: `${widthPct}%`, background: t.color, height: "100%", borderRadius: 6, transition: "width 0.4s ease" }} />
          </div>
          <div style={{ fontSize: 12, color: "#475569", textAlign: "right", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
            <b style={{ color: "#1B2430" }}>{fmt(real)}</b> / {fmt(meta)}{" "}
            <span style={{ color: t.color, fontWeight: 700 }}>({(pct * 100).toFixed(1)}%)</span>
            {ref25 !== undefined && (
              <div style={{ fontSize: 10, color: "#94A3B8", fontWeight: 400, marginTop: 1 }}>
                2025: {fmt(ref25)}
                {delta !== null && <span style={{ fontWeight: 700, color: delta >= 0 ? "#1E9E6B" : "#D9534F", marginLeft: 4 }}>{delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(0)}%</span>}
              </div>
            )}
          </div>
        </div>
      );
    }

    function EscolaRow({ isMobile, code, name, sub, esc, esc0, esc30, esc100 }) {
      const pctZero = esc > 0 ? esc0 / esc : 0;
      const pct30 = esc > 0 ? esc30 / esc : 0;
      const pct100 = esc > 0 ? esc100 / esc : 0;

      const Badge = ({ label, value, color }) => (
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: isMobile ? 13 : 15, fontWeight: 800, color }}>{value}</div>
          <div style={{ fontSize: 9, color: "#94A3B8", textTransform: "uppercase", letterSpacing: 0.3 }}>{label}</div>
        </div>
      );

      if (isMobile) {
        return (
          <div style={{ padding: "10px 0", borderBottom: "1px solid #F1F5F9" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <div style={{ fontSize: 10, fontWeight: 800, color: "white", background: "#0B3D91", borderRadius: 6, textAlign: "center", padding: "3px 7px", whiteSpace: "nowrap" }}>{code}</div>
              <div style={{ fontSize: 13, color: "#334155", fontWeight: 500, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{name}</div>
            </div>
            {sub && <div style={{ fontSize: 10, color: "#94A3B8", marginBottom: 6 }}>{sub}</div>}
            <div style={{ display: "flex", justifyContent: "space-around" }}>
              <Badge label="Escolas" value={esc} color="#1B2430" />
              <Badge label="Zero alunos" value={esc0} color="#D9534F" />
              <Badge label="Acima 30" value={esc30} color="#F0A93C" />
              <Badge label="Acima 100" value={esc100} color="#1E9E6B" />
            </div>
          </div>
        );
      }

      return (
        <div style={{ display: "grid", gridTemplateColumns: "36px 220px 1fr 90px 90px 90px 90px", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #F1F5F9" }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: "white", background: "#0B3D91", borderRadius: 6, textAlign: "center", padding: "3px 0" }}>{code}</div>
          <div style={{ fontSize: 13, color: "#334155", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={name}>
            {name}
            {sub && <div style={{ fontSize: 10, color: "#94A3B8", fontWeight: 400 }}>{sub}</div>}
          </div>
          <div style={{ position: "relative", background: "#EEF2F7", borderRadius: 6, height: 14, overflow: "hidden", display: "flex" }}>
            <div style={{ width: `${pctZero*100}%`, background: "#D9534F", height: "100%" }} title={`Zero: ${esc0}`} />
            <div style={{ width: `${(pct30-pct100)*100}%`, background: "#F0A93C", height: "100%" }} title={`Acima 30: ${esc30}`} />
            <div style={{ width: `${pct100*100}%`, background: "#1E9E6B", height: "100%" }} title={`Acima 100: ${esc100}`} />
          </div>
          <Badge label="Escolas" value={esc} color="#1B2430" />
          <Badge label="Zero" value={esc0} color="#D9534F" />
          <Badge label="Acima 30" value={esc30} color="#F0A93C" />
          <Badge label="Acima 100" value={esc100} color="#1E9E6B" />
        </div>
      );
    }

    function SortButtons({ sortBy, setSortBy, options }) {
      return (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {options.map(([key, label]) => (
            <button key={key} onClick={() => setSortBy(key)} style={{
                fontSize: 11, padding: "5px 10px", borderRadius: 999, border: "1px solid #E2E8F0",
                background: sortBy === key ? "#0B3D91" : "white", color: sortBy === key ? "white" : "#475569",
                cursor: "pointer", fontWeight: 600,
              }}>
              {label}
            </button>
          ))}
        </div>
      );
    }

    function sortData(arr, sortBy, nameKey) {
      const withPct = arr.map((d) => ({ ...d, pct: d.meta > 0 ? d.real / d.meta : 0 }));
      return withPct.sort((a, b) => {
        if (sortBy === "pct") return b.pct - a.pct;
        if (sortBy === "meta") return b.meta - a.meta;
        if (sortBy === "real") return b.real - a.real;
        if (sortBy === "pot") return b.pot - a.pot;
        if (sortBy === "esc") return b.esc - a.esc;
        if (sortBy === "esc0") return b.esc0 - a.esc0;
        if (sortBy === "esc30") return b.esc30 - a.esc30;
        if (sortBy === "esc100") return b.esc100 - a.esc100;
        return String(a[nameKey]).localeCompare(String(b[nameKey]));
      });
    }

    function CompareBar25v26({ isMobile, code, name, real25, real26, potencial2025Total }) {
      const max = Math.max(real25, real26, 1);
      const delta = real25 > 0 ? ((real26 - real25) / real25) * 100 : null;
      const deltaColor = delta === null ? "#94A3B8" : delta >= 0 ? "#1E9E6B" : "#D9534F";
      const pct2025 = potencial2025Total > 0 ? (real25 / potencial2025Total) * 100 : null;

      return (
        <div style={{ padding: "12px 0", borderBottom: "1px solid #F1F5F9" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
            <div style={{ fontSize: 10, fontWeight: 800, color: "white", background: "#0B3D91", borderRadius: 6, textAlign: "center", padding: "3px 7px", whiteSpace: "nowrap" }}>{code}</div>
            <div style={{ fontSize: 13, color: "#334155", fontWeight: 600, flex: 1 }}>{name}</div>
            {delta !== null && (
              <div style={{ fontSize: 11, fontWeight: 700, color: deltaColor }}>
                {delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(0)}% vs 2025
              </div>
            )}
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
            <div style={{ fontSize: 10, color: "#94A3B8", width: 40 }}>2025</div>
            <div style={{ flex: 1, position: "relative", background: "#EEF2F7", borderRadius: 6, height: 14, overflow: "hidden" }}>
              <div style={{ width: `${(real25 / max) * 100}%`, background: "#94A3B8", height: "100%", borderRadius: 6 }} />
            </div>
            <div style={{ fontSize: 11, color: "#64748B", width: isMobile ? 60 : 90, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
              {fmt(real25)}{pct2025 !== null ? ` (${pct2025.toFixed(1)}%)` : ""}
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ fontSize: 10, color: "#94A3B8", width: 40 }}>2026</div>
            <div style={{ flex: 1, position: "relative", background: "#EEF2F7", borderRadius: 6, height: 14, overflow: "hidden" }}>
              <div style={{ width: `${(real26 / max) * 100}%`, background: "#1665D8", height: "100%", borderRadius: 6 }} />
            </div>
            <div style={{ fontSize: 11, color: "#1B2430", fontWeight: 700, width: isMobile ? 60 : 90, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
              {fmt(real26)}
            </div>
          </div>
        </div>
      );
    }

    const ALL_DISTS = DISTRIB.map((d) => d.dist);

    function Painel() {
      const isMobile = useIsMobile();
      const [tab, setTab] = useState("distribuidora");

      const [sortByDist, setSortByDist] = useState("pct");

      const [regDistFilter, setRegDistFilter] = useState("Todas");
      const [sortByReg, setSortByReg] = useState("pct");

      const [muniDistFilter, setMuniDistFilter] = useState("Todas");
      const [muniRegFilter, setMuniRegFilter] = useState("Todas");
      const [query, setQuery] = useState("");
      const [sortByMuni, setSortByMuni] = useState("real");

      const [escDistFilter, setEscDistFilter] = useState("Todas");
      const [sortByEsc, setSortByEsc] = useState("esc");

      const totalPot = DISTRIB.reduce((s, d) => s + d.pot, 0);
      const totalMeta = DISTRIB.reduce((s, d) => s + d.meta, 0);
      const totalReal = DISTRIB.reduce((s, d) => s + d.real, 0);
      const totalPct = totalMeta > 0 ? totalReal / totalMeta : 0;
      const totalEsc = DISTRIB.reduce((s, d) => s + d.esc, 0);
      const totalEsc0 = DISTRIB.reduce((s, d) => s + d.esc0, 0);
      const totalEsc30 = DISTRIB.reduce((s, d) => s + d.esc30, 0);
      const totalEsc100 = DISTRIB.reduce((s, d) => s + d.esc100, 0);

      const critico = DISTRIB.filter((d) => (d.meta > 0 ? d.real / d.meta : 0) < 0.1).length;
      const atencao = DISTRIB.filter((d) => { const p = d.meta > 0 ? d.real / d.meta : 0; return p >= 0.1 && p < 0.2; }).length;
      const ritmo = DISTRIB.length - critico - atencao;

      const distSorted = useMemo(() => sortData(DISTRIB, sortByDist, "dist"), [sortByDist]);

      const regFilteredRaw = useMemo(() => regDistFilter === "Todas" ? REGIONAIS : REGIONAIS.filter((r) => r.dist === regDistFilter), [regDistFilter]);
      const regSorted = useMemo(() => sortData(regFilteredRaw, sortByReg, "regional"), [regFilteredRaw, sortByReg]);

      const regionalOptions = useMemo(() => {
        const pool = muniDistFilter === "Todas" ? MUNICIPIOS : MUNICIPIOS.filter((m) => m.dist === muniDistFilter);
        return Array.from(new Set(pool.map((m) => m.regional))).sort();
      }, [muniDistFilter]);

      const q = query.trim().toLowerCase();
      const muniPool = useMemo(() => {
        return MUNICIPIOS.filter((m) =>
          (muniDistFilter === "Todas" || m.dist === muniDistFilter) &&
          (muniRegFilter === "Todas" || m.regional === muniRegFilter)
        );
      }, [muniDistFilter, muniRegFilter]);
      const muniFinal = useMemo(() => {
        const withQuery = q.length >= 2 ? muniPool.filter((m) => m.mun.toLowerCase().includes(q)) : muniPool;
        return sortData(withQuery, sortByMuni, "mun");
      }, [muniPool, q, sortByMuni]);
      const showList = q.length >= 2 || muniDistFilter !== "Todas" || muniRegFilter !== "Todas";

      const escPool = useMemo(() => {
        const pool = escDistFilter === "Todas" ? MUNICIPIOS : MUNICIPIOS.filter((m) => m.dist === escDistFilter);
        return pool.filter((m) => m.esc > 0);
      }, [escDistFilter]);
      const escSorted = useMemo(() => sortData(escPool, sortByEsc, "mun"), [escPool, sortByEsc]);

      return (
        <div style={{ padding: isMobile ? "16px 12px 32px" : "28px 20px 48px", color: "#1B2430" }}>
          <div style={{ maxWidth: 1140, margin: "0 auto" }}>
            {/* Header */}
            <div style={{
                background: "linear-gradient(135deg, #0B3D91 0%, #1665D8 100%)",
                borderRadius: 16, padding: isMobile ? "18px 18px" : "22px 28px", color: "white",
                display: "flex", justifyContent: "space-between", alignItems: isMobile ? "flex-start" : "center",
                flexDirection: isMobile ? "column" : "row", flexWrap: "wrap", gap: 12
            }}>
              <div>
                <div style={{ fontSize: 11, letterSpacing: 2, opacity: 0.75, fontWeight: 600, textTransform: "uppercase" }}>
                  ONEE 2026 · Equatorial (MA·PI·PA·GO·AL) · CEEE (RS) · CEA (AP)
                </div>
                <h1 style={{ margin: "4px 0 0", fontSize: isMobile ? 19 : 25, fontWeight: 800, letterSpacing: -0.3 }}>
                  Potencial × Meta × Realizado
                </h1>
              </div>
              <div style={{ textAlign: isMobile ? "left" : "right", fontSize: 12, opacity: 0.85 }}>
                <div>Potencial e Meta: planilha proporcionalizada por Distribuidora/Município</div>
                <div>Realizado: base de inscrições por escola · atualização de 21/08/2026</div>
              </div>
            </div>

            {/* KPIs */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14, marginTop: 18 }}>
              <KpiCard label="Potencial (total de alunos)" value={fmt(totalPot)} sub="base elegível nas 7 distribuidoras" accent="#64748B" />
              <KpiCard label="Meta agrupada" value={fmt(totalMeta)} sub="alunos previstos" accent="#0B3D91" />
              <KpiCard label="Realizado agrupado" value={fmt(totalReal)} sub="alunos cadastrados" accent="#1665D8" />
              <KpiCard label="% da meta atingida" value={`${(totalPct * 100).toFixed(1)}%`} sub={`faltam ${fmt(totalMeta - totalReal)} cadastros`} accent={tier(totalPct).color} />
            </div>

            <div style={{ display: "flex", gap: 18, marginTop: 18, marginLeft: 4, fontSize: 12, color: "#475569", flexWrap: "wrap" }}>
              <LegendDot color="#1E9E6B" label={`Em ritmo (≥20%) — ${ritmo} distrib.`} />
              <LegendDot color="#F0A93C" label={`Atenção (10–20%) — ${atencao} distrib.`} />
              <LegendDot color="#D9534F" label={`Crítico (<10%) — ${critico} distrib.`} />
            </div>

            {/* Tabs */}
            <div style={{ display: "flex", gap: 8, marginTop: 22, marginBottom: -1, flexWrap: "wrap" }}>
              {[["distribuidora", "Por Distribuidora"], ["comparativo", "2025 × 2026"], ["regional", "Por Regional"], ["municipio", "Filtrar por Município"], ["escolas", "Escolas por Faixa"]].map(([key, label]) => (
                <button key={key} onClick={() => setTab(key)} style={{
                    fontSize: 13, fontWeight: 700, padding: "10px 16px", borderRadius: "10px 10px 0 0",
                    border: "1px solid #E2E8F0", borderBottom: "none",
                    background: tab === key ? "white" : "#EEF2F7", color: tab === key ? "#0B3D91" : "#64748B", cursor: "pointer",
                  }}>
                  {label}
                </button>
              ))}
            </div>

            {tab === "distribuidora" && (
              <div style={{ background: "white", borderRadius: "0 16px 16px 16px", padding: isMobile ? "16px 14px 6px" : "18px 24px 8px", boxShadow: "0 1px 3px rgba(16,24,40,0.06)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: isMobile ? "flex-start" : "center", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 10 : 0, marginBottom: 10 }}>
                  <h2 style={{ fontSize: 15, fontWeight: 700, margin: 0, color: "#1B2430" }}>Potencial, meta e realizado por distribuidora ({DISTRIB.length})</h2>
                  <SortButtons sortBy={sortByDist} setSortBy={setSortByDist} options={[["pct","% atingido"],["meta","Meta"],["pot","Potencial"],["real","Realizado"],["dist","A–Z"]]} />
                </div>
                {distSorted.map((d) => (
                  <ProgressRow key={d.uf + d.dist} isMobile={isMobile} code={d.uf} name={d.dist} sub={d.regiao} pot={d.pot} meta={d.meta} real={d.real} ref25={d.real25} />
                ))}
              </div>
            )}

            {tab === "comparativo" && (
              <div style={{ background: "white", borderRadius: "0 16px 16px 16px", padding: isMobile ? "16px 14px 6px" : "18px 24px 8px", boxShadow: "0 1px 3px rgba(16,24,40,0.06)" }}>
                <div style={{ marginBottom: 12 }}>
                  <h2 style={{ fontSize: 15, fontWeight: 700, margin: "0 0 2px", color: "#1B2430" }}>Alunos cadastrados: 2025 vs 2026 (mesma época)</h2>
                  <p style={{ fontSize: 11, color: "#94A3B8", margin: 0 }}>2025: cadastros totais do programa no ano anterior · 2026: realizado atual do ciclo em andamento</p>
                </div>
                {[...DISTRIB].sort((a, b) => b.real25 - a.real25).map((d) => (
                  <CompareBar25v26 key={d.dist} isMobile={isMobile} code={d.uf} name={d.dist} real25={d.real25} real26={d.real} potencial2025Total={0} />
                ))}
                <div style={{ display: "flex", justifyContent: "space-around", padding: "16px 0 6px", marginTop: 8, borderTop: "1px solid #F1F5F9", flexWrap: "wrap", gap: 10 }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#64748B" }}>{fmt(DISTRIB.reduce((s,d)=>s+d.real25,0))}</div>
                    <div style={{ fontSize: 10, color: "#94A3B8", textTransform: "uppercase" }}>Total 2025</div>
                  </div>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#1665D8" }}>{fmt(DISTRIB.reduce((s,d)=>s+d.real,0))}</div>
                    <div style={{ fontSize: 10, color: "#94A3B8", textTransform: "uppercase" }}>Total 2026 (até o momento)</div>
                  </div>
                </div>
              </div>
            )}

            {tab === "regional" && (
              <div style={{ background: "white", borderRadius: "0 16px 16px 16px", padding: isMobile ? "16px 14px 6px" : "18px 24px 8px", boxShadow: "0 1px 3px rgba(16,24,40,0.06)" }}>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
                  <select value={regDistFilter} onChange={(e) => setRegDistFilter(e.target.value)} style={{ fontSize: 13, padding: "8px 10px", borderRadius: 8, border: "1px solid #E2E8F0", fontFamily: "inherit" }}>
                    <option value="Todas">Todas as distribuidoras</option>
                    {ALL_DISTS.map((d) => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: isMobile ? "flex-start" : "center", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 10 : 0, marginBottom: 10 }}>
                  <h2 style={{ fontSize: 15, fontWeight: 700, margin: 0, color: "#1B2430" }}>Regionais {regDistFilter !== "Todas" ? `de ${regDistFilter}` : ""} ({regSorted.length})</h2>
                  <SortButtons sortBy={sortByReg} setSortBy={setSortByReg} options={[["pct","% atingido"],["meta","Meta"],["pot","Potencial"],["real","Realizado"],["regional","A–Z"]]} />
                </div>
                {regSorted.map((r) => (
                  <ProgressRow key={r.dist + r.regional} isMobile={isMobile} code={r.dist.replace("Equatorial ","EQTL ").replace(" Equatorial","").slice(0,6)} name={r.regional} sub={r.dist} pot={r.pot} meta={r.meta} real={r.real} />
                ))}
              </div>
            )}

            {tab === "municipio" && (
              <div style={{ background: "white", borderRadius: "0 16px 16px 16px", padding: isMobile ? "16px 14px 6px" : "18px 24px 8px", boxShadow: "0 1px 3px rgba(16,24,40,0.06)" }}>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
                  <select value={muniDistFilter} onChange={(e) => { setMuniDistFilter(e.target.value); setMuniRegFilter("Todas"); }} style={{ fontSize: 13, padding: "8px 10px", borderRadius: 8, border: "1px solid #E2E8F0", fontFamily: "inherit" }}>
                    <option value="Todas">Todas as distribuidoras</option>
                    {ALL_DISTS.map((d) => <option key={d} value={d}>{d}</option>)}
                  </select>
                  <select value={muniRegFilter} onChange={(e) => setMuniRegFilter(e.target.value)} style={{ fontSize: 13, padding: "8px 10px", borderRadius: 8, border: "1px solid #E2E8F0", fontFamily: "inherit" }}>
                    <option value="Todas">Todas as regionais</option>
                    {regionalOptions.map((r) => <option key={r} value={r}>{r}</option>)}
                  </select>
                  <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar município..."
                    style={{ flex: 1, minWidth: 180, fontSize: 13, padding: "8px 12px", borderRadius: 8, border: "1px solid #E2E8F0", fontFamily: "inherit" }} />
                </div>

                {!showList && (
                  <div style={{ fontSize: 13, color: "#94A3B8", padding: "20px 0", textAlign: "center" }}>
                    Escolha uma distribuidora, uma regional, ou digite ao menos 2 letras para buscar entre os {MUNICIPIOS.length.toLocaleString("pt-BR")} municípios.
                  </div>
                )}

                {showList && (
                  <React.Fragment>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: isMobile ? "flex-start" : "center", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 10 : 0, marginBottom: 10 }}>
                      <span style={{ fontSize: 12, color: "#64748B" }}>
                        {muniFinal.length} município{muniFinal.length !== 1 ? "s" : ""}{muniFinal.length > 200 ? " (mostrando os 200 primeiros)" : ""}
                      </span>
                      <SortButtons sortBy={sortByMuni} setSortBy={setSortByMuni} options={[["real","Realizado"],["pct","% atingido"],["meta","Meta"],["pot","Potencial"],["mun","A–Z"]]} />
                    </div>
                    {muniFinal.length === 0 && (
                      <div style={{ fontSize: 13, color: "#94A3B8", padding: "20px 0", textAlign: "center" }}>Nenhum município encontrado.</div>
                    )}
                    {muniFinal.slice(0, 200).map((m) => (
                      <ProgressRow key={m.uf + m.mun + m.dist} isMobile={isMobile} code={m.uf} name={m.mun} sub={`${m.dist} · ${m.regional}`} pot={m.pot} meta={m.meta} real={m.real} />
                    ))}
                  </React.Fragment>
                )}
              </div>
            )}

            {tab === "escolas" && (
              <div style={{ background: "white", borderRadius: "0 16px 16px 16px", padding: isMobile ? "16px 14px 6px" : "18px 24px 8px", boxShadow: "0 1px 3px rgba(16,24,40,0.06)" }}>
                <div style={{ display: "flex", justifyContent: "space-around", padding: "6px 0 16px", borderBottom: "1px solid #F1F5F9", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#1B2430" }}>{fmt(totalEsc)}</div>
                    <div style={{ fontSize: 10, color: "#94A3B8", textTransform: "uppercase" }}>Total de escolas</div>
                  </div>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#D9534F" }}>{fmt(totalEsc0)}</div>
                    <div style={{ fontSize: 10, color: "#94A3B8", textTransform: "uppercase" }}>Com zero alunos</div>
                  </div>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#F0A93C" }}>{fmt(totalEsc30)}</div>
                    <div style={{ fontSize: 10, color: "#94A3B8", textTransform: "uppercase" }}>Acima de 30 alunos</div>
                  </div>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: "#1E9E6B" }}>{fmt(totalEsc100)}</div>
                    <div style={{ fontSize: 10, color: "#94A3B8", textTransform: "uppercase" }}>Acima de 100 alunos</div>
                  </div>
                </div>

                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
                  <select value={escDistFilter} onChange={(e) => setEscDistFilter(e.target.value)} style={{ fontSize: 13, padding: "8px 10px", borderRadius: 8, border: "1px solid #E2E8F0", fontFamily: "inherit" }}>
                    <option value="Todas">Todas as distribuidoras</option>
                    {ALL_DISTS.map((d) => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>

                <h2 style={{ fontSize: 15, fontWeight: 700, margin: "0 0 4px", color: "#1B2430" }}>Por distribuidora</h2>
                {(escDistFilter === "Todas" ? DISTRIB : DISTRIB.filter((d) => d.dist === escDistFilter)).map((d) => (
                  <EscolaRow key={d.uf + d.dist} isMobile={isMobile} code={d.uf} name={d.dist} sub={d.regiao} esc={d.esc} esc0={d.esc0} esc30={d.esc30} esc100={d.esc100} />
                ))}

                <h2 style={{ fontSize: 15, fontWeight: 700, margin: "20px 0 4px", color: "#1B2430" }}>Por regional {escDistFilter !== "Todas" ? `de ${escDistFilter}` : ""}</h2>
                {(escDistFilter === "Todas" ? REGIONAIS : REGIONAIS.filter((r) => r.dist === escDistFilter)).filter((r) => r.esc > 0).map((r) => (
                  <EscolaRow key={r.dist + r.regional} isMobile={isMobile} code={r.dist.replace("Equatorial ","EQTL ").replace(" Equatorial","").slice(0,6)} name={r.regional} sub={r.dist} esc={r.esc} esc0={r.esc0} esc30={r.esc30} esc100={r.esc100} />
                ))}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: isMobile ? "flex-start" : "center", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 10 : 0, margin: "20px 0 6px" }}>
                  <h2 style={{ fontSize: 15, fontWeight: 700, margin: 0, color: "#1B2430" }}>Por município {escDistFilter !== "Todas" ? `de ${escDistFilter}` : ""} ({escSorted.length} com escolas)</h2>
                  <SortButtons sortBy={sortByEsc} setSortBy={setSortByEsc} options={[["esc","Escolas"],["esc0","Zero"],["esc30","Acima 30"],["esc100","Acima 100"],["mun","A–Z"]]} />
                </div>
                {escSorted.length === 0 && (
                  <div style={{ fontSize: 13, color: "#94A3B8", padding: "20px 0", textAlign: "center" }}>Nenhum município com escolas cadastradas nesse filtro.</div>
                )}
                {escSorted.slice(0, 200).map((m) => (
                  <EscolaRow key={m.uf + m.mun + m.dist} isMobile={isMobile} code={m.uf} name={m.mun} sub={`${m.dist} · ${m.regional}`} esc={m.esc} esc0={m.esc0} esc30={m.esc30} esc100={m.esc100} />
                ))}
              </div>
            )}

            <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 14, textAlign: "center" }}>
              Fonte: Meta_Proporcionalizada por Distribuidora/Município (potencial e meta), base de inscrições por escola (realizado 2026 e faixas), MUNICIPIOS_por_regional.xlsx (regional) e relatório "Estudantes cadastrados por Estado" (realizado 2025).<br/>
              Painel restrito às distribuidoras Equatorial MA/PI/PA/GO/AL, CEEE Equatorial (RS) e CEA Equatorial (AP).
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Painel />);
  </script>
</body>
</html>
